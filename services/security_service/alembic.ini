# Alembic configuration for the Zenith Security Service.

[alembic]

# Location of this service's migration scripts.
script_location = %(here)s/alembic

# Add the Zenith project root to Python's import path.
prepend_sys_path = ../../

# Use the operating system's path separator.
path_separator = os


[post_write_hooks]


# Logging configuration.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S